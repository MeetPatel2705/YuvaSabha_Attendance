name: Keep hosted instance awake

# Manual "wake it now" button for the free-tier Render backend, which sleeps
# after ~15 min without requests and takes ~30-60s to wake (Actions tab >
# Keep hosted instance awake > Run workflow).
#
# The daily schedule no longer lives here. As a scheduled workflow, GitHub
# fired it 20 min to 7 hours late (often after midnight IST, long after the
# 9 PM check-in window) and auto-disabled it after 60 days without a commit.
# The schedule is now an external cron-job.org job — see DEPLOY.md, "Free-tier
# behavior". With no schedule trigger, GitHub never auto-disables this one.
#
# Pings the repository variable APP_URL if it is set, otherwise the production
# Render URL below (the one the client's VITE_API_BASE_URL points at).

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://yuvasabha-attendance.onrender.com' }}
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "$APP_URL/api/health"
