name: Keep hosted instance awake

# Runs every day at 20:55 IST (15:25 UTC) — a few minutes before the 9 PM
# check-in window normally opens, hitting the side-effect-free /api/health
# endpoint so the sleeping free-tier Render instance is already awake by the
# time real members try to check in. (Data lives in Neon Postgres, so a
# Render sleep/wake cycle costs nothing but the cold-start delay.)
#
# Runs daily rather than only on Saturdays on purpose: the admin panel can
# reschedule Yuva Sabha to a different weekday for a given week (see
# server/lib/settings.js), so this doesn't try to track which day is
# currently configured — it just stays ahead of 9 PM regardless of which day
# that turns out to be.
#
# Requires a repository variable APP_URL (Settings > Secrets and variables >
# Actions > Variables) set to the Render backend's base URL, e.g.
# https://yuvasabha-attendance.onrender.com
#
# Note: GitHub disables scheduled workflows on repos with no commit activity
# for 60+ days. If this silently stops firing, re-enable it from the
# Actions tab (or just push a commit).

on:
  schedule:
    - cron: '25 15 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check endpoint
        run: curl -fsS --max-time 60 "${{ vars.APP_URL }}/api/health"
